version: '3.8'

services:
  # 1. FastAPI Web Application Container
  api:
    build: .
    container_name: alis_fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports  # Keeps your generated reports safe on the host VM drive
    restart: always

  # 2. Celery Asynchronous Worker Container
  celery_worker:
    build: .
    container_name: alis_celery_worker
    command: python -m celery -A worker.celery_app worker --loglevel=info --pool=threads
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports  # Shares the same folder so the worker can write files to it
    restart: always